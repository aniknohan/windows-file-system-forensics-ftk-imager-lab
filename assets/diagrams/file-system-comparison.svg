<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 624" width="960" height="624" role="img"><title>File system comparison</title><rect width="960" height="624" rx="14" fill="#0d1117"/><text x="36" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">Same Deletion, Three File Systems</text><text x="36" y="80" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">secret.txt deleted through Windows, then examined in FTK Imager 8.2</text><rect x="36" y="104" width="288" height="404" rx="10" fill="#161b22" stroke="#30363d"/><rect x="36" y="104" width="288" height="5" rx="2" fill="#58a6ff"/><text x="56" y="146" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#58a6ff">NTFS</text><text x="56" y="168" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e">NTFS_LAB · PHYSICALDRIVE1</text><text x="56" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">CLUSTER SIZE</text><text x="56" y="219" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">4,096 bytes</text><text x="56" y="245" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">KEY STRUCTURES</text><text x="56" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">$MFT · $LogFile · $Bitmap</text><text x="56" y="290" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">DELETED ENTRY</text><text x="56" y="309" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Not listed in root</text><text x="56" y="335" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">RECYCLE BIN PAIRS</text><text x="56" y="354" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">1  ($IY5NXTE / $RY5NXTE)</text><text x="56" y="380" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">21-BYTE FILE USES</text><text x="56" y="399" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">24 bytes (MFT-resident)</text><text x="56" y="425" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">TIMESTAMPS</text><text x="56" y="444" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">UTC</text><text x="56" y="470" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">UNALLOCATED REGIONS</text><text x="56" y="489" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">3</text><rect x="336" y="104" width="288" height="404" rx="10" fill="#161b22" stroke="#30363d"/><rect x="336" y="104" width="288" height="5" rx="2" fill="#bc8cff"/><text x="356" y="146" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#bc8cff">FAT32</text><text x="356" y="168" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e">FAT32_LAB · PHYSICALDRIVE2</text><text x="356" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">CLUSTER SIZE</text><text x="356" y="219" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">2,048 bytes</text><text x="356" y="245" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">KEY STRUCTURES</text><text x="356" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">FAT1 · FAT2 · VBR</text><text x="356" y="290" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">DELETED ENTRY</text><text x="356" y="309" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Visible, 0xE5 marker</text><text x="356" y="335" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">RECYCLE BIN PAIRS</text><text x="356" y="354" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">4</text><text x="356" y="380" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">21-BYTE FILE USES</text><text x="356" y="399" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">2,048 bytes (slack)</text><text x="356" y="425" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">TIMESTAMPS</text><text x="356" y="444" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Local time</text><text x="356" y="470" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">UNALLOCATED REGIONS</text><text x="356" y="489" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">2</text><rect x="636" y="104" width="288" height="404" rx="10" fill="#161b22" stroke="#30363d"/><rect x="636" y="104" width="288" height="5" rx="2" fill="#d29922"/><text x="656" y="146" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#d29922">FAT16</text><text x="656" y="168" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e">FAT_LAB · PHYSICALDRIVE3</text><text x="656" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">CLUSTER SIZE</text><text x="656" y="219" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">4,096 bytes</text><text x="656" y="245" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">KEY STRUCTURES</text><text x="656" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">FAT1 · FAT2 · VBR</text><text x="656" y="290" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">DELETED ENTRY</text><text x="656" y="309" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Visible as !ecret.txt</text><text x="656" y="335" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">RECYCLE BIN PAIRS</text><text x="656" y="354" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">2</text><text x="656" y="380" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">21-BYTE FILE USES</text><text x="656" y="399" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">4,096 bytes (slack)</text><text x="656" y="425" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">TIMESTAMPS</text><text x="656" y="444" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Local time</text><text x="656" y="470" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b949e">UNALLOCATED REGIONS</text><text x="656" y="489" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">3</text><rect x="36" y="524" width="888" height="72" rx="10" fill="#161b22" stroke="#3fb950"/><text x="480" y="554" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Recovered on all three: <tspan font-family="Consolas, 'Courier New', monospace" fill="#3fb950">"Going be a CISO"</tspan> (16 bytes) from $RECYCLE.BIN</text><text x="480" y="580" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">Deleting a file through Windows removed it from view, not from the disk</text></svg>